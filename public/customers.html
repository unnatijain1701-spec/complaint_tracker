<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manage Customers — Urban Harvest</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav>
    <a href="log.html">Log Complaint</a>
    <a href="complaints.html">Complaints</a>
    <a href="dashboard.html">Dashboard</a>
    <span class="nav-spacer"></span>
    <span id="user-info"></span>
    <a href="#" id="logout-link">Log Out</a>
  </nav>
  <main>
    <h1>Manage Customers</h1>
    <div id="load-error"></div>
    <p id="customer-count">Loading...</p>

    <table>
      <thead><tr><th>Name</th><th>Plant</th><th></th></tr></thead>
      <tbody id="customers-tbody"></tbody>
    </table>

    <h2>Add a Customer</h2>
    <div id="add-message"></div>
    <form id="add-customer-form">
      <label>
        Customer Name
        <input type="text" name="name" required />
      </label>
      <label>
        Plant
        <select name="plant" id="add-plant" required>
          <option value="">Select plant</option>
        </select>
      </label>
      <button type="submit">Add Customer</button>
    </form>

    <h2>Import from Excel</h2>
    <p id="import-help"></p>
    <div id="import-message"></div>
    <form id="import-form">
      <label>
        Excel File
        <input type="file" name="file" accept=".xlsx" required />
      </label>
      <button type="submit">Import</button>
    </form>
  </main>
  <script src="js/auth-guard.js"></script>
  <script src="js/customers.js"></script>
</body>
</html>
