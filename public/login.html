<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — Urban Harvest</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    main { max-width: 360px; margin: 4rem auto; }
  </style>
</head>
<body>
  <main>
    <h1>Urban Harvest Complaint Tracker</h1>
    <div id="message"></div>
    <form id="login-form">
      <label>
        Email
        <input type="email" name="email" required autofocus />
      </label>
      <label>
        Password
        <input type="password" name="password" required />
      </label>
      <button type="submit">Log In</button>
    </form>
  </main>
  <script src="js/login.js"></script>
</body>
</html>
