<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Complaint Detail — Urban Harvest</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .field-grid {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 0.5rem 1rem;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .field-grid dt { font-weight: 600; color: var(--color-muted); }
    .field-grid dd { margin: 0; }
    .attachments { display: flex; flex-wrap: wrap; gap: 1rem; }
    .attachments img {
      width: 160px;
      height: 160px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--color-border);
    }
  </style>
</head>
<body>
  <nav>
    <a href="log.html">Log Complaint</a>
    <a href="complaints.html">Complaints</a>
    <a href="dashboard.html">Dashboard</a>
    <span class="nav-spacer"></span>
    <span id="user-info"></span>
    <a href="#" id="logout-link">Log Out</a>
  </nav>
  <main>
    <h1>Complaint Detail</h1>
    <div id="content">Loading...</div>
  </main>
  <script src="js/auth-guard.js"></script>
  <script src="js/complaint-detail.js"></script>
</body>
</html>
